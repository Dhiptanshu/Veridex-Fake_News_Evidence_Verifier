[project]
name = "fnev-backend"
version = "0.1.0"
description = "Fake News Evidence Verifier - API and NLP pipeline"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "nltk>=3.9",
  "spacy>=3.7",   # plus the model: python ml/setup_nlp.py
  "textblob>=0.18",
  "gensim>=4.3",
  "httpx>=0.27",
  "sentence-transformers>=3.0",   # needs torch; CPU build: pip install torch --index-url https://download.pytorch.org/whl/cpu
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
