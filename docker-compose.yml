# docker compose up --build   ->   http://localhost:8000
# Needs the artefacts from the README's build steps in ./data (indexes, models, processed). Allow about 4 GB of RAM.
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # All optional; see docs/API_KEYS.md. Put them in a .env file next to this one (never commit it).
      FNEV_WIKIPEDIA_CONTACT: ${FNEV_WIKIPEDIA_CONTACT:-}
      FNEV_GNEWS_API_KEY: ${FNEV_GNEWS_API_KEY:-}
      FNEV_NEWSAPI_KEY: ${FNEV_NEWSAPI_KEY:-}
      FNEV_ANTHROPIC_API_KEY: ${FNEV_ANTHROPIC_API_KEY:-}
    volumes:
      - ./data/indexes:/app/data/indexes:ro
      - ./data/models:/app/data/models:ro
      - ./data/processed:/app/data/processed:ro
    restart: unless-stopped
